name: BlueStar data

# Keeps the panel's helper data fresh: the build history of the catalog's games (hourly) and the
# full Explore game list (daily). Only commits when something changed.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluestar-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Record new builds
        run: python3 bluestar/tools/record_builds.py bluestar

      - name: Rebuild the Explore list (once a day)
        run: |
          if [ "$(date -u +%H)" != "04" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          curl -fsSL -o /tmp/catalog.sqlite.zst https://github.com/Coronitaa/BlueStar-Catalog/releases/latest/download/catalog.sqlite.zst
          zstd -d -f /tmp/catalog.sqlite.zst -o /tmp/catalog.sqlite
          python3 bluestar/tools/build_explore_index.py /tmp/catalog.sqlite bluestar/explore-index.json

      - name: Commit
        run: |
          git config user.name "bluestar-data[bot]"
          git config user.email "bluestar-data@users.noreply.github.com"
          git add bluestar/builds bluestar/explore-index.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: refresh BlueStar builds/Explore list"
          git push
